<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 285" width="100%" height="100%">
  <defs>
    <filter id="amber-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff9e00" flood-opacity="0.18" />
    </filter>
    <style>
      .window-bg { fill: #0d1117; stroke: #ff9e00; stroke-width: 1.2; rx: 8px; }
      .title-bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .title-text { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
      .status-text { fill: #39ff14; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: bold; }
      .hdr { fill: #ff9e00; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: bold; letter-spacing: 0.5px; }
      .lbl { fill: #ffaa00; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
      .dots { fill: #333a42; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }
      .val { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }
      .divider { stroke: #21262d; stroke-width: 1; }
    </style>
  </defs>

  <rect x="4" y="4" width="842" height="277" class="window-bg" filter="url(#amber-glow)" />

  <path d="M 4 10 Q 4 4 10 4 L 840 4 Q 846 4 846 10 L 846 34 L 4 34 Z" class="title-bar" />
  <circle cx="20" cy="19" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="19" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="19" r="4.5" fill="#27c93f" />
