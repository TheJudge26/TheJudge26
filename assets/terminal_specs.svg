  <text x="32" y="259" font-family="ui-monospace, monospace" font-size="12.5px">
    <tspan fill="#39ff14" font-weight="bold">tyler</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#ff9e00" font-weight="bold">workstation</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#39ff14" font-weight="bold">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></tspan>
